name: GitHub 3D Isometric Calendar

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generate 3D Commit City
        uses: lowlighter/metrics@latest
        with:
          filename: github-metrics-3d.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          user: eniomartinst
          base: ""
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
