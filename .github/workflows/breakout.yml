name: Generate Breakout

on:
  schedule:
    # Roda a cada 24 horas
    - cron: "0 0 * * *" 
  
  # Permite rodar manualmente
  workflow_dispatch:
  
  # Roda a cada commit na main
  push:
    branches:
    - main
    
jobs:
  generate:
    permissions: 
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    
    steps:
      # Gera o jogo Breakout a partir do gráfico de contribuições
      - name: generate github-breakout
        uses: cyprieng/github-breakout@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          github_username: ${{ github.repository_owner }}
          output_path: dist/
          # Paleta customizada do Solo Leveling! (Tons de roxo + base escura)
          paddle_color: "#8A2BE2"
          ball_color: "#8A2BE2"
          bricks_colors: "#161b22,#2d114f,#551f8a,#7b2ebd,#a353eb"
          
      # Salva a imagem gerada na branch 'output'
      - name: push breakout to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
