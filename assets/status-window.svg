<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" width="100%">
  <style>
    .box { fill: transparent; stroke: #8A2BE2; stroke-width: 2; }
    .inner-box { fill: transparent; stroke: #8A2BE2; stroke-width: 1; stroke-dasharray: 4 4; opacity: 0.5; }
    .txt { font-family: 'Consolas', 'Courier New', monospace; font-size: 16px; fill: #d4a8ff; }
    .highlight { fill: #8A2BE2; font-weight: bold; }
